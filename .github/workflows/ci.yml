name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check house_twin tests

      - name: Syntax check
        run: python -m py_compile house_twin/*.py

      - name: Signing tests
        # Proves we reproduce Aqara's published signature example.
        run: python tests/test_signing.py

      - name: Geometry validates
        run: python -m house_twin.house

      - name: Layout override round-trips and rejects bad input
        run: |
          python -c "
          import json, tempfile, pathlib
          from house_twin.house import House
          h = House()
          with tempfile.TemporaryDirectory() as d:
              p = pathlib.Path(d) / 'house_layout.json'
              h.save_layout(p)
              assert House.load(p).to_dict() == h.to_dict(), 'round-trip differs'
              print('round-trip OK')
          # partial override keeps untouched defaults
          with tempfile.TemporaryDirectory() as d:
              p = pathlib.Path(d) / 'l.json'
              p.write_text(json.dumps({
                  'sensors': [{'id': 'aq_attic', 'x': 24.0, 'z': 27.0}],
                  'levels': [{'index': 0, 'rooms': [{'id': 'bath_main', 'name': 'Main Bath'}]}],
              }))
              o = House.load(p)
              a = [s for s in o.sensors if s.id == 'aq_attic'][0]
              assert (a.x, a.z) == (24.0, 27.0)
              assert o.room('bath_main').name == 'Main Bath'
              assert o.room('living').width == 18, 'untouched default lost'
              print('partial override OK')
          # bad input must raise, not silently fall back
          for name, body in [
              ('malformed', '{not json'),
              ('overflow', json.dumps({'levels':[{'index':0,'rooms':[{'id':'living','width':99,'depth':99}]}]})),
              ('no tile', json.dumps({'levels':[{'index':1,'rooms':[{'id':'bedroom_1','width':5,'depth':5}]}]})),
              ('bad room', json.dumps({'sensors':[{'id':'aq_attic','room_id':'nope','x':1,'z':1,'level':2}]})),
          ]:
              with tempfile.TemporaryDirectory() as d:
                  p = pathlib.Path(d) / 'l.json'
                  p.write_text(body)
                  try:
                      House.load(p)
                      raise AssertionError(f'{name} was not rejected')
                  except ValueError:
                      pass
          print('bad input rejected OK')
          "

      - name: Poller idles without credentials
        run: |
          python -c "
          import logging, tempfile, pathlib
          from house_twin.poller import poll_once, assign_devices
          from house_twin.house import House
          from house_twin.client import AqaraClient
          from house_twin.config import Config
          from house_twin import store
          with tempfile.TemporaryDirectory() as d:
              cfg = Config(pathlib.Path(d) / 'config.json')
              conn = store.connect(pathlib.Path(d) / 'h.db')
              client = AqaraClient(cfg)
              assert poll_once(client, House(), conn) == 0, 'should write nothing'
              assert store.latest(conn) == []
              print('idle poller OK')
              # positional fallback assigns unnamed devices
              house = House()
              devs = [{'did': 'a', 'name': 'Sensor 1'}, {'did': 'b', 'name': 'Sensor 2'}]
              m = assign_devices(house, devs)
              assert len(m) == 2, m
              print('device fallback OK')
          "

      - name: Store round-trip
        run: |
          python -m house_twin.seed --hours 2 --step 300
          python -c "
          from house_twin import store
          c = store.connect()
          assert len(store.latest(c)) == 9, store.latest(c)
          assert store.stats(c, 24)['sensors'] == 9
          assert len(store.history(c, 'aq_living', 2, limit=10)) <= 10
          print('store OK')
          "

      - name: API smoke test
        run: |
          python -c "
          import house_twin.web as w
          c = w.app.test_client()
          for path in ['/', '/api/house', '/api/readings', '/api/status']:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code)
              print(r.status_code, path)
          r = c.get('/api/history/aq_living?hours=1')
          assert r.status_code == 200
          assert r.get_json()['points'], 'no history points'
          r = c.get('/api/history/nope')
          assert r.status_code == 404
          print('404 guard OK')
          # layout endpoint must reject invalid input
          for bad in ['not json', {}, {'sensors': [{'id':'aq_attic','room_id':'nope','x':1,'z':1,'level':2}]}]:
              r = c.post('/api/layout', json=bad)
              assert r.status_code == 400, (bad, r.status_code)
          print('layout validation OK')
          "

      - name: plists parse
        # plutil is macOS-only, so validate with plistlib instead. This runs on
        # the Linux runner and actually parses the XML rather than shelling out.
        run: |
          python -c "
          import plistlib, pathlib
          for p in sorted(pathlib.Path('setup').glob('*.plist')):
              with p.open('rb') as fh:
                  d = plistlib.load(fh)
              assert d['Label'].startswith('com.dolbec.housetwin'), d['Label']
              assert '__PROJECT_ROOT__' in ' '.join(d['ProgramArguments']), d
              assert d['WorkingDirectory'] == '__PROJECT_ROOT__', d
              print(p.name, '->', d['Label'])
          print('plists OK')
          "

      - name: shell script is valid
        run: bash -n setup_launch.sh && echo "setup_launch.sh OK"
